<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>密室｜第柒門</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container game-page" id="main"><p class="empty">正在打開門鎖…</p></main>

  <script type="module">
    import { supabase, mountHeader, escapeHTML, toast } from './js/app.js';

    const { user, profile } = await mountHeader();
    const main = document.querySelector('#main');
    const slug = new URLSearchParams(location.search).get('room');

    const locked = (title, text, cta = '<a class="btn btn-gold" href="index.html#rooms">回到大廳</a>') => {
      main.innerHTML = `<div class="game-locked"><h1>${title}</h1><p>${text}</p><div class="btns">${cta}</div></div>`;
    };

    const { data: game } = slug
      ? await supabase.from('games').select('*').eq('slug', slug).maybeSingle()
      : { data: null };

    if (!game) {
      locked('找不到這間密室', '可能網址打錯了，回大廳重新挑一間吧。');
    } else if (game.status !== 'available') {
      document.title = `${game.title}｜第柒門`;
      locked(escapeHTML(game.title), '這間密室還在佈置中，開放後就能進入。');
    } else if (!user) {
      // 沒有帳號：不能玩
      locked('門鎖著，需要鑰匙', '訪客可以逛大廳，但要進入密室必須先免費註冊並建立角色。',
        `<a class="btn btn-gold" href="login.html?mode=signup">免費註冊並建立角色</a>
         <a class="btn btn-ghost" href="login.html">我已經有帳號</a>`);
    } else if (!profile) {
      locked('還差一步：建立角色', '建立角色後，才能用他的身分走進密室。',
        `<a class="btn btn-gold" href="character.html">建立角色</a>`);
    } else {
      document.title = `${game.title}｜第柒門`;
      main.innerHTML = `
        <div class="game-top">
          <h1>${escapeHTML(game.title)}</h1>
          <div class="timer" id="timer" aria-live="off">00:00</div>
          <a class="btn btn-ghost" href="index.html#rooms">離開密室</a>
        </div>
        <iframe class="game-frame" id="frame" title="${escapeHTML(game.title)}"
          src="games/${encodeURIComponent(game.slug)}/index.html"
          allow="fullscreen; autoplay"></iframe>`;

      // 建立遊玩紀錄
      const { data: record } = await supabase.from('play_records')
        .insert({ user_id: user.id, game_id: game.id }).select().single();

      // 計時
      const start = Date.now();
      const timerEl = document.querySelector('#timer');
      const tick = setInterval(() => {
        const s = Math.floor((Date.now() - start) / 1000);
        timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }, 1000);

      // 遊戲通關時，從 iframe 內呼叫：
      // window.parent.postMessage({ type: 'escape-room:cleared' }, '*')
      window.addEventListener('message', async (e) => {
        if (e.source !== document.querySelector('#frame').contentWindow) return;
        if (e.data?.type !== 'escape-room:cleared' || !record) return;
        clearInterval(tick);
        const secs = Math.floor((Date.now() - start) / 1000);
        await supabase.from('play_records')
          .update({ status: 'cleared', clear_time_sec: secs }).eq('id', record.id);
        toast(`成功逃脫！用時 ${timerEl.textContent}`);
      });

      // 遊戲需要玩家資料時可以讀這個
      document.querySelector('#frame').addEventListener('load', (e) => {
        e.target.contentWindow.postMessage({
          type: 'escape-room:player',
          player: { username: profile.username, appearance: profile.appearance, avatar_url: profile.avatar_url },
        }, '*');
      });
    }
  </script>
</body>
</html>
