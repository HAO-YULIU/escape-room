<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入｜第柒門</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="auth-wrap">
      <h1 id="title">歡迎回來</h1>
      <p class="lead" id="lead">登入後繼續你的逃脫。</p>
      <div class="panel">
        <div class="tabs" role="tablist">
          <button role="tab" id="tab-login" aria-selected="true">登入</button>
          <button role="tab" id="tab-signup" aria-selected="false">註冊</button>
        </div>
        <form id="auth-form" novalidate>
          <div class="field">
            <label for="email">電子郵件</label>
            <input id="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">密碼（至少 6 個字元）</label>
            <input id="password" type="password" autocomplete="current-password" minlength="6" required>
          </div>
          <p class="form-msg" id="msg" aria-live="polite"></p>
          <button class="btn btn-gold" style="width:100%" id="submit" type="submit">登入</button>
        </form>
        <p class="auth-note">註冊完成後，會帶你去建立角色。</p>
      </div>
    </div>
  </main>

  <footer class="simple">© 第柒門 線上密室逃脫</footer>

  <script type="module">
    import { supabase, mountHeader, getUser, getProfile } from './js/app.js';

    await mountHeader();

    // 已登入就直接導走
    const existing = await getUser();
    if (existing) {
      location.href = (await getProfile(existing.id)) ? 'index.html' : 'character.html';
    }

    let mode = new URLSearchParams(location.search).get('mode') === 'signup' ? 'signup' : 'login';
    const $ = (s) => document.querySelector(s);
    const msg = (text, type = 'error') => { $('#msg').textContent = text; $('#msg').dataset.type = type; };

    function setMode(m) {
      mode = m;
      $('#tab-login').setAttribute('aria-selected', m === 'login');
      $('#tab-signup').setAttribute('aria-selected', m === 'signup');
      $('#title').textContent = m === 'login' ? '歡迎回來' : '取得你的鑰匙';
      $('#lead').textContent = m === 'login' ? '登入後繼續你的逃脫。' : '免費註冊，接著建立你的角色就能進入密室。';
      $('#submit').textContent = m === 'login' ? '登入' : '註冊';
      $('#password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
      msg('');
    }
    $('#tab-login').onclick = () => setMode('login');
    $('#tab-signup').onclick = () => setMode('signup');
    setMode(mode);

    const errorText = (e) => {
      const m = e.message || '';
      if (m.includes('Invalid login credentials')) return '電子郵件或密碼不正確。';
      if (m.includes('Email not confirmed')) return '這個帳號還沒完成信箱驗證，請先到信箱點擊驗證連結。';
      if (m.includes('already registered')) return '這個電子郵件已經註冊過了，請直接登入。';
      if (m.includes('Password')) return '密碼至少需要 6 個字元。';
      return m;
    };

    $('#auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#email').value.trim();
      const password = $('#password').value;
      if (!email || password.length < 6) return msg('請輸入電子郵件，以及至少 6 個字元的密碼。');

      $('#submit').disabled = true;
      msg('處理中…', 'ok');

      if (mode === 'login') {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        $('#submit').disabled = false;
        if (error) return msg(errorText(error));
        const profile = await getProfile(data.user.id);
        location.href = profile ? 'index.html' : 'character.html';
      } else {
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { emailRedirectTo: new URL('character.html', location.href).href },
        });
        $('#submit').disabled = false;
        if (error) return msg(errorText(error));
        if (data.session) {
          location.href = 'character.html';
        } else {
          msg('註冊成功！請到信箱點擊驗證連結，驗證後就會回到這裡建立角色。', 'ok');
        }
      }
    });
  </script>
</body>
</html>
